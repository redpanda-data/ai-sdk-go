version: '3'

dotenv: ['.env.local', '.env']

vars:
  BUILD_ROOT: "{{.ROOT_DIR}}/.build"
  BIN_DIR: "{{.BUILD_ROOT}}/.bin"
  GO_VERSION: 1.26.5
  GO_ROOT: "{{.BUILD_ROOT}}/go{{.GO_VERSION}}"
  GO_BIN: "{{.GO_ROOT}}/bin/go"
  MODULE_PATH: github.com/redpanda-data/ai-sdk-go

# GOROOT / GOTOOLCHAIN are exported via per-command inline assignments
# below (not top-level env:) so they override any inherited shell GOROOT
# — task's env: block does NOT beat OS env, so a contributor with a
# stale GOROOT (e.g. left by `go env -w GOROOT=...`) would otherwise
# see phantom "version X does not match go tool version Y" typecheck
# errors from the pinned toolchain.

includes:
  install: taskfiles/install.yaml

tasks:
  license:
    desc: Add Apache 2.0 license headers to all Go files
    deps:
      - install:addlicense
    cmds:
      - '{{.BIN_DIR}}/addlicense -f header.txt -ignore ".build/**" **/*.go'

  license:check:
    desc: Check that all Go files have Apache 2.0 license headers
    deps:
      - install:addlicense
    cmds:
      - '{{.BIN_DIR}}/addlicense -f header.txt -ignore ".build/**" -check **/*.go'

  lint:
    desc: Run golangci-lint on all directories with Go files (excluding build/)
    deps:
      - install:golangci-lint
    cmds:
      - 'GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local PATH={{.GO_ROOT}}/bin:$PATH {{.BIN_DIR}}/golangci-lint run --fix --timeout 10m ./...'

  lint:new:
    desc: Run golangci-lint only on new issues (uncommitted changes)
    deps:
      - install:golangci-lint
    cmds:
      - 'GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local PATH={{.GO_ROOT}}/bin:$PATH {{.BIN_DIR}}/golangci-lint run --fix --new --timeout 10m ./...'

  test:
    desc: Run all tests with coverage
    deps:
      - install:go
      - install:tparse
    cmds:
      - 'GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local {{.GO_BIN}} test -json -cover -parallel 10 -timeout 30m ./... | {{.BIN_DIR}}/tparse -follow -all'

  test:unit:
    desc: Run unit tests only with coverage (excludes integration tests)
    deps:
      - install:go
      - install:tparse
    cmds:
      - 'GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local {{.GO_BIN}} test -json -cover -short -parallel 10 ./... | {{.BIN_DIR}}/tparse -follow -all'

  test:integration:
    desc: Run integration tests with coverage (requires OPENAI_API_KEY)
    deps:
      - install:go
      - install:tparse
    cmds:
      - 'GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local {{.GO_BIN}} test -json -cover -parallel 10 -timeout 30m -run Integration ./... | {{.BIN_DIR}}/tparse -follow -all'

  examples:build:
    desc: Build every example module (examples/ is excluded from the root module)
    deps:
      - install:go
    cmds:
      # The root go.mod carries `ignore ./examples`, so examples are invisible
      # to ./... — lint, test and CI all skip them. Each example is its own
      # module with a replace back to the root, so they only stay compilable if
      # something builds them explicitly. `go build` also fails on an untidy
      # go.mod, which catches the common rot: root deps move forward and the
      # example's pins go stale.
      - |
        set -eu
        for mod in examples/*/go.mod; do
          dir=$(dirname "$mod")
          echo "==> building $dir"
          (cd "$dir" && GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local {{.GO_BIN}} build ./...)
        done

  test:conformance:
    desc: Run the Vercel AI SDK UI message stream conformance suite (requires node + bun)
    dir: adapter/vercelaisdk/uimessagestream/conformance
    cmds:
      - bash run.sh

  security:
    desc: Run security vulnerability checks (govulncheck + osv-scanner)
    deps:
      - install:go
      - install:govulncheck
      - install:osv-scanner
    cmds:
      - 'GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local {{.BIN_DIR}}/govulncheck ./...'
      - 'GOROOT={{.GO_ROOT}} GOTOOLCHAIN=local {{.BIN_DIR}}/osv-scanner --lockfile go.mod'

  ci:
    desc: Run all CI checks (license, lint, test:unit, examples:build)
    cmds:
      - task: license:check
      - task: lint
      - task: test:unit
      - task: examples:build
