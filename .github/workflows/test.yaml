name: "Test"

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
      - '.github/reconcile-models/RULES.md'
      - '.github/reconcile-models/report.schema.json'
      - '.github/reconcile-models/prompt.md'
      - '.github/reconcile-models/decisions.yaml'
      - '.github/reconcile-models/named-sources.json'
      - '.claude/skills/**'
      - '.github/workflows/reconcile-models.yml'
  pull_request:
    # ready_for_review starts the full run on the reconcile bot's PRs (see the
    # jobs below); on everyone else's PRs it does nothing.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
      - '.github/reconcile-models/RULES.md'
      - '.github/reconcile-models/report.schema.json'
      - '.github/reconcile-models/prompt.md'
      - '.github/reconcile-models/decisions.yaml'
      - '.github/reconcile-models/named-sources.json'
      - '.claude/skills/**'
      - '.github/workflows/reconcile-models.yml'
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    # The reconcile bot's draft PRs contain unreviewed, agent-written code, so
    # they get the job below instead; the full run starts once a person marks
    # the PR ready for review. Other PRs behave exactly as before.
    if: >-
      (github.event_name != 'pull_request_target' ||
      github.event.label.name == 'ci:force-tests') &&
      !(github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'vbotbuildovich' &&
      github.event.pull_request.draft) &&
      !(github.event.action == 'ready_for_review' &&
      github.event.pull_request.user.login != 'vbotbuildovich')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum', 'Taskfile.yaml', 'taskfiles/install.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502376765358:role/ai-sdk-go-ci-bedrock
          aws-region: us-east-1

      - uses: go-task/setup-task@v1

      - name: Run CI checks
        run: task test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  test-untrusted:
    name: Test (bot draft, no secrets)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'vbotbuildovich' &&
      github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No id-token and no secrets; no caches either, so untrusted code can't
    # poison what the trusted job restores.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: go-task/setup-task@v1

      - name: Run unit tests
        run: task test:unit
