---
# Enrollment in the DevProd AI-approved-merge pilot (DEVPROD-4812).
# Presence of THIS file is the repo-level opt-in: every PR is evaluated
# automatically (no per-PR label). Add the `ai-merge-skip` label to a PR to
# opt it out. All logic lives in the pinned reusable workflow in devprod-infra.
name: AI Approved Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-merge:
    uses: redpanda-data/devprod-infra/.github/workflows/ai-approved-merge.yml@ai-merge/v1
    with:
      config_path: .github/ai-merge.yml
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      app_id: ${{ secrets.AI_MERGE_APP_ID }}
      app_private_key: ${{ secrets.AI_MERGE_APP_PRIVATE_KEY }}
