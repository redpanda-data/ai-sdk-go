name: Model Catalog Reconciliation, one vendor

# One vendor's part of reconcile-models.yml: the gate, the agent, the patch
# check and the record, on the commit the previous vendor left (base_sha).
# Its commit goes to the next vendor and to the caller's pr job as a git
# bundle. Nothing here gets the bot token: the caller pushes once, at the end.
on:
  workflow_call:
    inputs:
      vendor:
        description: A named-sources.json key
        type: string
        required: true
      base_sha:
        description: The commit to work on, the run's own or the previous vendor's
        type: string
        required: true
      dry_run:
        description: Leave no baseline for the gate; required, so it is never left out by accident
        type: boolean
        required: true
      force:
        description: Run the agent even if the gate finds nothing changed
        type: boolean
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      # Read by the agent job's debug-logging check: a called workflow sees
      # only the secrets passed to it.
      ACTIONS_STEP_DEBUG:
        required: false
    outputs:
      head:
        description: This vendor's commit, or base_sha when it changed nothing; empty unless its check job finished
        value: ${{ jobs.check.outputs.head }}
      changed:
        value: ${{ jobs.check.outputs.changed }}

permissions: {}

env:
  PROVIDER: ${{ inputs.vendor }}
  # "true" or "false". Real-run steps check for 'false', so anything else
  # counts as a dry run.
  DRY_RUN: ${{ inputs.dry_run }}
  FORCE: ${{ inputs.force }}
  BASE_SHA: ${{ inputs.base_sha }}
  # shadow: the gate reports "would skip" but the agent always runs. Switch to
  # enforce once the record job's comparisons show skips would lose nothing.
  GATE_MODE: shadow
  # The oldest baseline the gate relies on: past a week, so last week's
  # scheduled run still counts.
  MAX_AGE: 192h

jobs:
  # No model. Fingerprints the vendor's pages and the run's inputs, and
  # compares them with the last successful real run's, to skip the agent
  # when nothing changed. Anything it can't prove unchanged runs the agent.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to find and download the last real run's fingerprints
    outputs:
      run_agent: ${{ steps.gate.outputs.run_agent }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      - name: Find the last real run's fingerprints
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: reconcile-fingerprints-${{ env.PROVIDER }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          WORKFLOW_PATH: .github/workflows/reconcile-models.yml
        run: .github/reconcile-models/find-baseline.sh >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        with:
          name: reconcile-fingerprints-${{ env.PROVIDER }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: out/gate/baseline
      - name: Fingerprint the sources (no model)
        id: gate
        # A failed gate leaves run_agent empty, which runs the agent.
        continue-on-error: true
        env:
          BASE_RUN: ${{ steps.baseline.outputs.run_id }}
        run: |
          task catalog:gate -- -provider "$PROVIDER" -mode "$GATE_MODE" -force="$FORCE" -max-age "$MAX_AGE" \
            -baseline out/gate/baseline/fingerprints.json -baseline-run "$BASE_RUN" -out out/gate >>"$GITHUB_OUTPUT"
          cat out/gate/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: reconcile-gate-${{ env.PROVIDER }}
          path: out/gate/
          retention-days: 14
          # A re-run of this vendor replaces its own artifact.
          overwrite: true

  agent:
    needs: gate
    # A failed gate runs the agent too (!cancelled() lifts the implicit
    # success() check).
    if: ${{ !cancelled() && needs.gate.outputs.run_agent != 'false' }}
    runs-on: ubuntu-24.04
    # A launch across three hosts took 17 minutes and 163 turns (run 12).
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      # No telemetry, error reports or update checks, so their hosts stay off
      # the allowlist below.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Every later step reaches only these hosts; a request to any other host
      # fails by itself without failing the job. The list is what recorded runs
      # reached: the model, the named sources, then installs (Claude Code,
      # GitHub, Go and its modules, apt). Harden-Runner also always allows
      # GitHub's Actions domains, private ranges and Azure's VM address.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            platform.claude.com:443
            cloud.google.com:443
            docs.cloud.google.com:443
            aws.amazon.com:443
            docs.aws.amazon.com:443
            pricing.us-east-1.amazonaws.com:443
            developers.openai.com:443
            downloads.claude.ai:443
            claude.ai:443
            registry.npmjs.org:443
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            *.githubapp.com:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            esm.ubuntu.com:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # Every vendor after the first works on the previous vendor's commit,
      # which comes as a bundle because nothing is pushed until the end.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: inputs.base_sha != github.sha
        with:
          name: reconcile-bundle-${{ inputs.base_sha }}
          path: ${{ runner.temp }}/base
      - name: Check out the base
        run: .github/reconcile-models/checkout-base.sh "$BASE_SHA" "$RUNNER_TEMP/base/reconcile.bundle"
      - name: Check the egress block
        run: .github/reconcile-models/check-egress.sh
      - name: Stop Docker
        run: .github/reconcile-models/stop-docker.sh
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      # Claude Code needs bubblewrap to scrub secrets from subprocesses. The
      # action installs it only for non-write users, so do it here, the same way.
      - name: Install subprocess isolation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # claude-code-action prints the agent's whole conversation when debug
      # logging is on, and this repository's logs are public, so refuse it.
      - name: Refuse debug logging
        env:
          STEP_DEBUG_SECRET: ${{ secrets.ACTIONS_STEP_DEBUG }}
          STEP_DEBUG_VAR: ${{ vars.ACTIONS_STEP_DEBUG }}
        run: |
          if [[ "${RUNNER_DEBUG:-}" == "1" || "$STEP_DEBUG_SECRET" == "true" || "$STEP_DEBUG_VAR" == "true" ]]; then
            echo "::error::Debug logging is on, which would print the agent's conversation into this public log. Re-run without debug logging."
            exit 1
          fi
      - name: Prepare prompt and schema
        id: inputs
        run: |
          {
            echo "prompt<<EOF_PROMPT"
            sources=.github/reconcile-models/named-sources.json
            hosts="$(jq -r --arg p "$PROVIDER" '.[$p].hosts | join(", ")' "$sources")"
            owned="$(jq -r --arg p "$PROVIDER" '.[$p].providers | join(", ")' "$sources")"
            sed -e "s/{{PROVIDER}}/${PROVIDER}/g" -e "s/{{HOSTS}}/${hosts}/g" -e "s/{{PROVIDERS}}/${owned}/g" .github/reconcile-models/prompt.md
            echo "EOF_PROMPT"
            echo "schema=$(jq -c . .github/reconcile-models/report.schema.json)"
            # Edit rights on the Go files of each owned provider.
            echo "edits=$(jq -r --arg p "$PROVIDER" '.[$p].providers | map("Edit(./providers/\(.)/*.go)") | join(",")' "$sources")"
          } >>"$GITHUB_OUTPUT"
      # Read(//proc/**): any process's environment is readable under /proc,
      # including this step's model key. The shell already runs without it.
      - name: Run reconcile-models
        id: claude
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.inputs.outputs.prompt }}
          settings: '{"disableAllHooks": true}'
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 300
            --append-system-prompt-file .github/reconcile-models/RULES.md
            --allowedTools "Skill,Read,Grep,Glob,${{ steps.inputs.outputs.edits }},Edit(./catalog/facts_data.go),Bash(curl:*),Bash(grep:*),Bash(jq:*),Bash(task catalog:snapshot),Bash(task test:unit),Bash(task lint:new),Bash(git diff:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(git push:*),Bash(git commit:*),Bash(gh:*),AskUserQuestion,Task,Agent,Read(//proc/**)"
            --json-schema '${{ steps.inputs.outputs.schema }}'
      - name: Collect patch and report
        # Also after a failed agent step, so the run leaves evidence to inspect.
        if: always()
        env:
          REPORT: ${{ steps.claude.outputs.structured_output }}
        # Start from an empty out/ and hand over only these two files, so
        # nothing else the agent wrote reaches the check job.
        run: |
          rm -rf out && mkdir out
          printf '%s' "$REPORT" >out/report.json
          # New files are untracked; mark them so the diff includes them.
          # pr-job.sh rejects any file outside the run's own providers.
          git ls-files --others --exclude-standard -- ":(glob)providers/*/*.go" | xargs -r git add -N --
          git diff -- ":(glob)providers/*/*.go" catalog/facts_data.go >out/patch.diff
      - name: Run stats
        if: always()
        # Diagnostics only: a failure here must not stop the check job.
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/reconcile-models/run-stats.sh "$EXECUTION_FILE" out/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: reconcile-agent-${{ env.PROVIDER }}
          path: |
            out/report.json
            out/patch.diff
          if-no-files-found: error
          retention-days: 7
          # A re-run of this vendor replaces its own artifact.
          overwrite: true

  # No model. Applies the agent's patch to the base, checks it in a sandbox
  # and commits it as this vendor's commit, for the next vendor and the
  # run's pr job.
  check:
    needs: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      head: ${{ steps.done.outputs.head }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # Every vendor after the first works on the previous vendor's commit,
      # which comes as a bundle because nothing is pushed until the end.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: inputs.base_sha != github.sha
        with:
          name: reconcile-bundle-${{ inputs.base_sha }}
          path: ${{ runner.temp }}/base
      - name: Check out the base
        run: .github/reconcile-models/checkout-base.sh "$BASE_SHA" "$RUNNER_TEMP/base/reconcile.bundle"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      # pr-job.sh runs the patched code in a bubblewrap sandbox with no network.
      - name: Install the sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: reconcile-agent-${{ env.PROVIDER }}
          path: out
      - name: Check the patch (no model)
        id: check
        run: |
          # Only pr-job.sh writes the rest of the vendor's folder.
          find out -mindepth 1 -maxdepth 1 ! -name report.json ! -name patch.diff -exec rm -rf -- {} +
          task install:go
          export PATH="$(dirname "$(ls -d "$PWD"/.build/go*/bin/go | tail -1)"):$PATH"
          GOTOOLCHAIN=local .github/reconcile-models/pr-job.sh "$PROVIDER" out
      - name: Job summary
        if: always()
        run: if [[ -f out/body.md ]]; then cat out/body.md >>"$GITHUB_STEP_SUMMARY"; fi
      # The commit names the run and the vendor, so a later run can tell
      # which run each of the PR's commits came from.
      - name: Commit this vendor's change
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          if [[ "$CHANGED" == "true" ]]; then
            bot_id="$(gh api users/vbotbuildovich --jq .id)"
            xargs -r -a out/files.txt git add --  # the files pr-job.sh checked
            git -c core.hooksPath=/dev/null -c user.name=vbotbuildovich -c user.email="${bot_id}+vbotbuildovich@users.noreply.github.com" \
              commit -m "chore(catalog): reconcile ${PROVIDER} models" -m "Reconcile-Run: ${GITHUB_RUN_ID}/${PROVIDER}"
            git bundle create "$RUNNER_TEMP/reconcile.bundle" HEAD "^${GITHUB_SHA}"
          fi
          echo "head=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      # What the run's pr job renders this vendor's part of the body from.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: reconcile-pr-${{ env.PROVIDER }}
          path: out/
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: steps.check.outputs.changed == 'true'
        with:
          name: reconcile-bundle-${{ steps.commit.outputs.head }}
          path: ${{ runner.temp }}/reconcile.bundle
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # Last, so the next vendor and the pr job get a head only when every
      # step above passed, the uploads included.
      - name: Hand on this vendor's commit
        id: done
        env:
          HEAD_SHA: ${{ steps.commit.outputs.head }}
        run: echo "head=${HEAD_SHA}" >>"$GITHUB_OUTPUT"

  # No model, on a fresh runner. After a green agent and check job, dry runs
  # included, it compares the run with the gate's page list and the baseline
  # run's findings; outside dry runs it then saves this run's fingerprints as
  # the next baseline. It runs nothing from the patch.
  record:
    needs: [gate, agent, check]
    if: needs.gate.outputs.verdict != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: reconcile-gate-${{ env.PROVIDER }}
          path: gate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: reconcile-agent-${{ env.PROVIDER }}
          path: gate/agent
      - name: Compare with the page list and the baseline run
        # A failed comparison must not stop the baseline from being saved.
        continue-on-error: true
        run: |
          task catalog:gate -- -compare -gate gate -report gate/agent/report.json \
            -baseline-report gate/baseline/report.json >>"$GITHUB_STEP_SUMMARY"
      - name: Collect the next baseline
        run: mkdir -p keep && cp -r gate/fingerprints.json gate/text gate/agent/report.json keep/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: env.DRY_RUN == 'false'
        with:
          name: reconcile-fingerprints-${{ env.PROVIDER }}
          path: keep/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
