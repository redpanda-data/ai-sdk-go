name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        (github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        (github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.author_association == 'MEMBER' ||
         github.event.review.author_association == 'OWNER' ||
         github.event.review.author_association == 'COLLABORATOR') &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        (github.event.issue.author_association == 'MEMBER' ||
         github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'COLLABORATOR') &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # A fork PR's code, description and comments are attacker-controlled,
      # and Claude runs with a write-scoped App token. Don't point it at them.
      - name: Refuse fork pull requests
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          IS_PR: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'true' || 'false' }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          head="$EVENT_HEAD_REPO"
          if [ -z "$head" ] && [ "$IS_PR" = true ] && [ -n "$NUMBER" ]; then
            head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.repo.full_name // ""')
          fi
          if [ -n "$head" ] && [ "$head" != "$REPO" ]; then
            echo "::notice::PR head is $head, not $REPO; not running Claude on fork content."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$head" ] && [ "$IS_PR" = true ]; then
            echo "::notice::PR head repository is gone; not running Claude."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.trust.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.trust.outputs.run == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

