name: "Lint"

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '.golangci.yaml'
      - '.github/workflows/golangci-lint.yaml'
  pull_request:
    paths:
      - '**.go'
      - '.golangci.yaml'
      - '.github/workflows/golangci-lint.yaml'

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: Golangci Lint
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # v8
        with:
          version: v2.11.3
          # Once we resolved the initial linting set of issues we should remove this
          only-new-issues: true
          # Skip cache management since actions/setup-go handles Go cache
          skip-cache: false
