name: Model Catalog Reconciliation
run-name: Probe check (AI-2550 test branch)

# Check branch only, never merged: the probe job alone, on planted IDs, to
# verify the Bedrock role's trust, the availability API and each host's
# answers.
on:
  workflow_dispatch:

permissions: {}

jobs:
  # No model. Calls each offering the vendors' commits add or change once
  # on its host, with a tiny request, for the PR body's "Live checks": the
  # only job with provider keys, so it runs the run's own code and reads
  # the vendors' folders only as data. A call that fails never stops the PR.
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the Bedrock CI role, for the Bedrock calls
    steps:
      # Every later step reaches only these hosts: the providers' APIs (and
      # AWS's token service), then installs (GitHub, Go and its modules).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.openai.com:443
            generativelanguage.googleapis.com:443
            sts.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.eu-central-1.amazonaws.com:443
            bedrock-runtime.eu-central-1.amazonaws.com:443
            bedrock.ap-southeast-2.amazonaws.com:443
            bedrock-runtime.ap-southeast-2.amazonaws.com:443
            bedrock.ap-northeast-1.amazonaws.com:443
            bedrock-runtime.ap-northeast-1.amazonaws.com:443
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            *.githubapp.com:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Check the egress block
        run: .github/reconcile-models/check-egress.sh
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      - name: Build catalog-probe
        run: |
          task install:go
          export PATH="$(dirname "$(ls -d "$PWD"/.build/go*/bin/go | tail -1)"):$PATH"
          GOTOOLCHAIN=local go build -o "$RUNNER_TEMP/catalog-probe" ./cmd/catalog-probe
      # The keyed tests' role (terraform/ai-sdk-ci), which may only call
      # Bedrock. When it can't be assumed, the Bedrock rows say so and the
      # other hosts are still called.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::502376765358:role/ai-sdk-go-ci-bedrock
          aws-region: us-east-1
      # The folder of each vendor whose change was checked and committed, as
      # the carry job picks the vendors' commits.
      - name: Call each new or changed offering (no model)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Check branch only: planted IDs instead of the vendors' folders.
          dirs=("$GITHUB_WORKSPACE/.github/reconcile-models/probe-check")
          "$RUNNER_TEMP/catalog-probe" -out out/probe "${dirs[@]}"
          cat out/probe/probes.md >>"$GITHUB_STEP_SUMMARY"
          cat out/probe/probe-results.json
      # Check branch only: what the read-only availability API says for
      # models CI has called and ones it never has. Invokes nothing.
      - name: Availability, read-only
        if: always()
        run: |
          aws sts get-caller-identity --query Arn --output text || true
          for model in anthropic.claude-haiku-4-5-20251001-v1:0 amazon.nova-2-lite-v1:0 amazon.nova-micro-v1:0 \
            cohere.command-r-plus-v1:0 writer.palmyra-x5-v1:0 deepseek.r1-v1:0 meta.llama3-3-70b-instruct-v1:0; do
            echo "== $model"
            aws bedrock get-foundation-model-availability --region us-east-1 --model-id "$model" --output json 2>&1 || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: reconcile-probe
          path: out/probe/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
