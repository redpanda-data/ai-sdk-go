name: reconcile-models

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to reconcile
        type: choice
        options: [anthropic]
        default: anthropic
      dry_run:
        description: Stop before pushing a branch or opening a PR
        type: boolean
        default: true
  # TEMPORARY, for testing on the PoC branch only. Remove before merging.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reconcile-models.yml
      - .github/reconcile-models/**

permissions: {}

concurrency:
  group: reconcile-models-${{ inputs.provider || 'anthropic' }}
  cancel-in-progress: false

env:
  PROVIDER: ${{ inputs.provider || 'anthropic' }}
  DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      # Claude Code needs bubblewrap to scrub secrets from subprocesses. The
      # action installs it only for non-write users, so do it here, the same way.
      - name: Install subprocess isolation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # claude-code-action prints the agent's whole conversation when debug
      # logging is on, and this repository's logs are public, so refuse it.
      - name: Refuse debug logging
        env:
          STEP_DEBUG_SECRET: ${{ secrets.ACTIONS_STEP_DEBUG }}
          STEP_DEBUG_VAR: ${{ vars.ACTIONS_STEP_DEBUG }}
        run: |
          if [[ "${RUNNER_DEBUG:-}" == "1" || "$STEP_DEBUG_SECRET" == "true" || "$STEP_DEBUG_VAR" == "true" ]]; then
            echo "::error::Debug logging is on, which would print the agent's conversation into this public log. Re-run without debug logging."
            exit 1
          fi
      - name: Prepare prompt and schema
        id: inputs
        run: |
          {
            echo "prompt<<EOF_PROMPT"
            sources=.github/reconcile-models/named-sources.json
            hosts="$(jq -r --arg p "$PROVIDER" '.[$p].hosts | join(", ")' "$sources")"
            owned="$(jq -r --arg p "$PROVIDER" '.[$p].providers | join(", ")' "$sources")"
            sed -e "s/{{PROVIDER}}/${PROVIDER}/g" -e "s/{{HOSTS}}/${hosts}/g" -e "s/{{PROVIDERS}}/${owned}/g" .github/reconcile-models/prompt.md
            echo "EOF_PROMPT"
            echo "schema=$(jq -c . .github/reconcile-models/report.schema.json)"
            # Edit rights on the Go files of each owned provider.
            echo "edits=$(jq -r --arg p "$PROVIDER" '.[$p].providers | map("Edit(./providers/\(.)/*.go)") | join(",")' "$sources")"
          } >>"$GITHUB_OUTPUT"
      - name: Run reconcile-models
        id: claude
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.inputs.outputs.prompt }}
          settings: '{"disableAllHooks": true}'
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Skill,Read,Grep,Glob,${{ steps.inputs.outputs.edits }},Edit(./catalog/facts_data.go),Bash(curl:*),Bash(grep:*),Bash(jq:*),Bash(task catalog:snapshot),Bash(task test:unit),Bash(task lint:new),Bash(git diff:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(git push:*),Bash(git commit:*),Bash(gh:*),AskUserQuestion,Task,Agent"
            --json-schema '${{ steps.inputs.outputs.schema }}'
      - name: Collect patch and report
        # Also after a failed agent step, so the run leaves evidence to inspect.
        if: always()
        env:
          REPORT: ${{ steps.claude.outputs.structured_output }}
        # Start from an empty out/ and hand over only these two files, so
        # nothing else the agent wrote reaches the PR job.
        run: |
          rm -rf out && mkdir out
          printf '%s' "$REPORT" >out/report.json
          # New files are untracked; mark them so the diff includes them.
          # pr-job.sh rejects any file outside the run's own providers.
          git ls-files --others --exclude-standard -- ":(glob)providers/*/*.go" | xargs -r git add -N --
          git diff -- ":(glob)providers/*/*.go" catalog/facts_data.go >out/patch.diff
      - name: Run stats
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/reconcile-models/run-stats.sh "$EXECUTION_FILE" out/report.json
      # TEMPORARY: prints the denied commands once, to diagnose the first CI
      # run's denials. Remove before merge.
      - name: Denied commands (temporary)
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          jq -n -r '[inputs] | map(if type == "array" then .[] else . end) | map(select(.type == "result")) | last
            | .permission_denials // [] | .[]
            | "denied \(.tool_name | tostring | .[0:40] | @json): \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:200] | @json)"' "$EXECUTION_FILE"
          echo "::$token::"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: reconcile-agent-${{ env.PROVIDER }}
          path: |
            out/report.json
            out/patch.diff
          if-no-files-found: error
          retention-days: 7

  pr:
    needs: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write # only used outside dry runs, to read the bot token
    env:
      # A run from main opens the real PR into main. A run from any other
      # branch opens a test PR into that branch, from its own bot branch, so it
      # shows only the bot's commit and never touches the real PR.
      BASE: ${{ github.ref_name }}
      BRANCH: ${{ github.ref_name == 'main' && 'bot/reconcile-models' || 'bot/reconcile-models-test' }}/${{ inputs.provider || 'anthropic' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      # pr-job.sh runs the patched code in a bubblewrap sandbox with no network.
      - name: Install the sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: reconcile-agent-${{ env.PROVIDER }}
          path: out
      - name: Check the patch (no model)
        id: check
        run: |
          rm -f out/body.md out/snapshot.diff out/files.txt  # only pr-job.sh writes these
          task install:go
          export PATH="$(dirname "$(ls -d "$PWD"/.build/go*/bin/go | tail -1)"):$PATH"
          GOTOOLCHAIN=local .github/reconcile-models/pr-job.sh "$PROVIDER" out
      - name: Job summary
        if: always()
        run: if [[ -f out/body.md ]]; then cat out/body.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: reconcile-pr-${{ env.PROVIDER }}
          path: |
            out/body.md
            out/snapshot.diff
          retention-days: 7
      # Only a person's recent, non-draft PR on a models.go this patch changes
      # blocks the bot: facts_data.go is shared by every provider, and long-lived
      # PRs and drafts would block it indefinitely.
      - name: Skip if a recent PR touches a models.go the patch changes
        id: race
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touched="$(grep -E '^providers/[a-z0-9]+/models\.go$' out/files.txt | tr '\n' ' ' || true)"
          others="$(TOUCHED="$touched" gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName,files,isDraft,createdAt \
            --jq '[.[] | select(.headRefName != env.BRANCH) | select(.isDraft | not)
              | select((.createdAt | fromdateiso8601) > (now - 7 * 86400))
              | select(any(.files[].path; . as $f | any(env.TOUCHED | split(" ")[]; . == $f)))
              | .number] | map(tostring) | join(",")')"
          if [[ -n "$others" ]]; then
            echo "Skipped: recent open PRs touch ${touched}: $others" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed == 'true' && steps.race.outputs.skip != 'true'
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88  # v3.0.2
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed == 'true' && steps.race.outputs.skip != 'true'
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - name: Push the rolling branch and open or update the draft PR
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed == 'true' && steps.race.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
        run: |
          bot_id="$(gh api users/vbotbuildovich --jq .id)"
          git config user.name vbotbuildovich
          git config user.email "${bot_id}+vbotbuildovich@users.noreply.github.com"
          git switch -C "$BRANCH"
          xargs -r -a out/files.txt git add --  # the files pr-job.sh checked
          git -c core.hooksPath=/dev/null commit -m "chore(catalog): reconcile ${PROVIDER} models"
          # A PR a person marked ready goes back to draft before the push, so new
          # agent code runs only test.yaml's no-secrets job until reviewed again.
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" && "$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "false" ]]; then
            gh pr ready "$existing" --repo "$GITHUB_REPOSITORY" --undo
          fi
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --base "$BASE" --body-file out/body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$BASE" --head "$BRANCH" \
              --title "chore(catalog): reconcile ${PROVIDER} models" --body-file out/body.md \
              --label ai-merge-skip --reviewer adamwownysz-redpanda
          fi
