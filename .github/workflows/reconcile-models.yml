name: Model Catalog Reconciliation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Vendor to reconcile (its models on every provider that sells them)
        type: choice
        options: [anthropic]
        default: anthropic
      dry_run:
        description: Stop before pushing a branch or opening a PR
        type: boolean
        default: true
      force:
        description: Run the agent even if the gate finds nothing changed
        type: boolean
        default: false
  # Weekly, a full run: the agent, and a draft PR into main when the catalog
  # drifted. Schedules run only from the default branch.
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: reconcile-models-${{ inputs.provider || 'anthropic' }}
  cancel-in-progress: false

env:
  PROVIDER: ${{ inputs.provider || 'anthropic' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  # Each vendor's part of the run: gate, agent, patch check and record, in
  # reconcile-vendor.yml. It commits its change but pushes nothing.
  anthropic:
    uses: ./.github/workflows/reconcile-vendor.yml
    permissions:
      contents: read
      actions: read
    with:
      vendor: ${{ inputs.provider || 'anthropic' }}
      base_sha: ${{ github.sha }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}

  # The only job with the bot token. It pushes the vendors' commits and opens
  # or updates the draft PR; it runs nothing from the patches.
  pr:
    needs: anthropic
    if: needs.anthropic.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write # only used outside dry runs, to read the bot token
    env:
      # A run from main opens the real PR into main. A run from any other
      # branch opens a test PR into that branch, from its own bot branch, so it
      # shows only the bot's commit and never touches the real PR.
      BASE: ${{ github.ref_name }}
      BRANCH: ${{ github.ref_name == 'main' && 'bot/reconcile-models' || 'bot/reconcile-models-test' }}/${{ inputs.provider || 'anthropic' }}
      TIP: ${{ needs.anthropic.outputs.head }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: reconcile-pr-${{ env.PROVIDER }}
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: reconcile-bundle-${{ env.TIP }}
          path: ${{ runner.temp }}/tip
      # A person's recent, non-draft PR on a models.go this patch changes doesn't
      # stop the bot: the PR body names it, so the reviewer can merge theirs
      # first, and the next run leaves out what it already contains. Drafts and
      # PRs older than 7 days aren't named, or long-lived PRs would always be.
      - name: Name recent PRs that touch the same models.go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touched="$(grep -E '^providers/[a-z0-9]+/models\.go$' out/files.txt | tr '\n' ' ' || true)"
          others="$(TOUCHED="$touched" gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName,files,isDraft,createdAt \
            --jq '[.[] | select(.headRefName != env.BRANCH) | select(.isDraft | not)
              | select((.createdAt | fromdateiso8601) > (now - 7 * 86400))
              | select(any(.files[].path; . as $f | any(env.TOUCHED | split(" ")[]; . == $f)))
              | .number] | map(tostring) | join(",")')"
          if [[ -n "$others" ]]; then
            echo "Recent open PRs touch ${touched}: $others"
            note="> **Open PRs touch the same files:** $(sed -E 's/[0-9]+/#&/g; s/,/, /g' <<<"$others"). If they overlap, merge theirs first: the next run leaves out what they already contain."
            { head -n 2 out/body.md; echo "$note"; echo; tail -n +3 out/body.md; } >out/body.next && mv out/body.next out/body.md
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        if: env.DRY_RUN == 'false'
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88  # v3.0.2
        if: env.DRY_RUN == 'false'
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - name: Push the rolling branch and open or update the draft PR
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
        run: |
          .github/reconcile-models/checkout-base.sh "$TIP" "$RUNNER_TEMP/tip/reconcile.bundle"
          git switch -C "$BRANCH"
          # The push below changes the code in every PR from this repo whose head
          # is $BRANCH, so stop if anyone but the bot has one open.
          others="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and .author.login != "vbotbuildovich") | "#\(.number)"] | join(", ")')"
          if [[ -n "$others" ]]; then
            echo "::error::Open PRs from ${BRANCH} by someone other than vbotbuildovich: ${others}. The push would put new agent code in them; close them or open them from another branch, then re-run."
            exit 1
          fi
          # A PR a person marked ready goes back to draft before the push, so new
          # agent code runs only test.yaml's no-secrets job until reviewed again.
          # Only the bot's own PR from this repo: --head matches a fork's PR
          # from a branch with the same name too.
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author,isCrossRepository \
            --jq '[.[] | select(.author.login == "vbotbuildovich" and (.isCrossRepository | not))][0].number // empty')"
          # The push is leased to the head read here, so it fails if anyone
          # pushes to the branch after this point; an empty head means the
          # branch must not exist yet.
          head="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          if [[ -n "$existing" ]]; then
            # Keep anyone else's commit on the bot PR: say what this run found
            # instead of pushing over it.
            commits="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${existing}/commits?per_page=100")"
            theirs="$(.github/reconcile-models/others-commits.sh vbotbuildovich <<<"$commits")"
            if [[ -n "$theirs" ]]; then
              run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "The latest run found catalog changes but didn't update this PR, because the update would remove commits that aren't the bot's (${theirs}). Merge or close this PR to let the next run update it. [The run](${run_url}) shows what it found."
              echo "::notice::Left #${existing} unchanged: it has commits that aren't the bot's (${theirs})."
              exit 0
            fi
            if [[ "$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "false" ]]; then
              gh pr ready "$existing" --repo "$GITHUB_REPOSITORY" --undo
            fi
          fi
          git push --force-with-lease="refs/heads/${BRANCH}:${head}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          if [[ -n "$existing" ]]; then
            # The label again on every update: a person may have removed it.
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --base "$BASE" --body-file out/body.md --add-label ai-merge-skip
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$BASE" --head "$BRANCH" \
              --title "chore(catalog): reconcile ${PROVIDER} models" --body-file out/body.md \
              --label ai-merge-skip --reviewer adamwownysz-redpanda
          fi
