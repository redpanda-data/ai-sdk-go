name: Model Catalog Reconciliation
run-name: >-
  Reconcile models: ${{ inputs.vendor || 'all' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Vendor to reconcile (its models on every provider that sells them), or all. Every other vendor with a change waiting in the PR replays it with no model.
        type: choice
        options: [all, anthropic, openai, google, amazon, meta, mistral]
        default: all
      dry_run:
        description: Stop before pushing a branch or opening a PR
        type: boolean
        default: true
      force:
        description: Run the agent even if the gate finds nothing changed
        type: boolean
        default: false
  # Weekly, a full run: every vendor's agent, and a draft PR into main when the
  # catalog drifted. Schedules run only from the default branch.
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

# One run at a time per bot branch (main's, or the one every other branch's
# test runs share); later ones wait in line instead of a newer one cancelling
# the one waiting.
concurrency:
  group: reconcile-models-${{ github.ref_name == 'main' && 'main' || 'test' }}
  cancel-in-progress: false
  queue: max

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  # One PR for every vendor. A run from main opens the real PR into main. A run
  # from any other branch opens a test PR into that branch, from its own bot
  # branch, so it shows only the bot's commits and never touches the real PR.
  BRANCH: ${{ github.ref_name == 'main' && 'bot/reconcile-models' || 'bot/reconcile-models-test' }}/all

jobs:
  # No model, before any agent: reads the open bot PR and the record its
  # last push left, and decides which vendors run their agent, which replay
  # their waiting commit, and whether someone else's commit stops the run.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read # to download the record from the run that pushed
    outputs:
      h0: ${{ steps.plan.outputs.h0 }}
      pr: ${{ steps.plan.outputs.pr }}
      run: ${{ steps.plan.outputs.run }}
      replay: ${{ steps.plan.outputs.replay }}
      carry: ${{ steps.plan.outputs.carry }}
      pending: ${{ steps.plan.outputs.pending }}
      dropped: ${{ steps.plan.outputs.dropped }}
      stop: ${{ steps.plan.outputs.stop }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      # Every branch's whole history, for plan.sh's check of the PR's merges.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the run (no model)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ inputs.vendor || 'all' }}
        run: |
          # The head the run's one push is leased to; empty while the branch
          # doesn't exist.
          h0="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          # Only the bot's own PR from this repo: --head matches a fork's PR
          # from a branch with the same name too.
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author,isCrossRepository \
            --jq '[.[] | select(.author.login == "vbotbuildovich" and (.isCrossRepository | not))][0].number // empty')"
          commits='[]'
          if [[ -n "$pr" ]]; then
            commits="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/commits?per_page=100")"
            # GitHub updates a PR's commit list a moment after a push. A plan made
            # from a list that stops short of the leased head would push over the
            # newest commit, so fail until the two agree.
            if [[ "$h0" != "$(jq -r 'last.sha // empty' <<<"$commits")" ]]; then
              echo "::error::#${pr}'s commit list doesn't end at ${h0} yet; re-run this workflow."
              exit 1
            fi
            # The PR's commits, for the plan's check of its merges.
            git fetch -q --no-tags origin "$h0"
          fi
          vendors="$(jq -c 'keys_unsorted' .github/reconcile-models/named-sources.json)"
          # The record the last push left, saved by the run the newest bot
          # commit's Reconcile-Run trailer names. Without one nothing replays.
          record=""
          record_run="$(jq -r '[.[] | select(.author.login == "vbotbuildovich" and .committer.login == "vbotbuildovich")
            | .commit.message | capture("(?m)^Reconcile-Run: (?<run>[0-9]+)/").run] | last // empty' <<<"$commits")"
          # Only a scheduled or by-hand run of this workflow, on this run's
          # branch and in this repo, as find-baseline.sh checks a baseline's:
          # any other run's record could name anyone's commit as the bot's.
          if [[ -n "$record_run" ]] && ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${record_run}" | jq -e --arg branch "$GITHUB_REF_NAME" '
            .path == ".github/workflows/reconcile-models.yml" and (.event == "schedule" or .event == "workflow_dispatch")
            and .head_branch == $branch and .head_repository.id == .repository.id' >/dev/null; then
            echo "::warning::Run ${record_run} isn't a scheduled or by-hand run of this workflow on ${GITHUB_REF_NAME}, so its record counts as none."
            record_run=""
          fi
          if [[ -n "$record_run" ]] && gh run download "$record_run" --repo "$GITHUB_REPOSITORY" -n reconcile-record -D "$RUNNER_TEMP/record"; then
            record="$RUNNER_TEMP/record/record.json"
          fi
          {
            echo "h0=$h0"
            echo "pr=$pr"
            .github/reconcile-models/plan.sh vbotbuildovich "$SELECTED" "$DRY_RUN" "$vendors" "$record" <<<"$commits"
          } >>"$GITHUB_OUTPUT"
      # The record the plan trusted, for the vendors that replay.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: steps.plan.outputs.record == 'true'
        with:
          name: reconcile-plan-record
          path: ${{ runner.temp }}/record/record.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Each vendor's part of the run, in named-sources.json's order: gate, agent,
  # patch check and record, in reconcile-vendor.yml. Each works on the newest
  # commit an earlier vendor made, else the run's own, and commits its change
  # without pushing it. A vendor runs even when an earlier one failed.
  anthropic:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.run), 'anthropic') }}
    uses: ./.github/workflows/reconcile-vendor.yml
    permissions:
      contents: read
      actions: read
    with:
      vendor: anthropic
      mode: ${{ contains(fromJSON(needs.plan.outputs.replay), 'anthropic') && 'replay' || 'agent' }}
      base_sha: ${{ github.sha }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}

  openai:
    needs: [plan, anthropic]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.run), 'openai') }}
    uses: ./.github/workflows/reconcile-vendor.yml
    permissions:
      contents: read
      actions: read
    with:
      vendor: openai
      mode: ${{ contains(fromJSON(needs.plan.outputs.replay), 'openai') && 'replay' || 'agent' }}
      base_sha: ${{ needs.anthropic.outputs.head || github.sha }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}

  google:
    needs: [plan, anthropic, openai]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.run), 'google') }}
    uses: ./.github/workflows/reconcile-vendor.yml
    permissions:
      contents: read
      actions: read
    with:
      vendor: google
      mode: ${{ contains(fromJSON(needs.plan.outputs.replay), 'google') && 'replay' || 'agent' }}
      base_sha: ${{ needs.openai.outputs.head || needs.anthropic.outputs.head || github.sha }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}

  amazon:
    needs: [plan, anthropic, openai, google]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.run), 'amazon') }}
    uses: ./.github/workflows/reconcile-vendor.yml
    permissions:
      contents: read
      actions: read
    with:
      vendor: amazon
      mode: ${{ contains(fromJSON(needs.plan.outputs.replay), 'amazon') && 'replay' || 'agent' }}
      base_sha: ${{ needs.google.outputs.head || needs.openai.outputs.head || needs.anthropic.outputs.head || github.sha }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}

  meta:
    needs: [plan, anthropic, openai, google, amazon]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.run), 'meta') }}
    uses: ./.github/workflows/reconcile-vendor.yml
    permissions:
      contents: read
      actions: read
    with:
      vendor: meta
      mode: ${{ contains(fromJSON(needs.plan.outputs.replay), 'meta') && 'replay' || 'agent' }}
      base_sha: ${{ needs.amazon.outputs.head || needs.google.outputs.head || needs.openai.outputs.head || needs.anthropic.outputs.head || github.sha }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}

  mistral:
    needs: [plan, anthropic, openai, google, amazon, meta]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.run), 'mistral') }}
    uses: ./.github/workflows/reconcile-vendor.yml
    permissions:
      contents: read
      actions: read
    with:
      vendor: mistral
      mode: ${{ contains(fromJSON(needs.plan.outputs.replay), 'mistral') && 'replay' || 'agent' }}
      base_sha: ${{ needs.meta.outputs.head || needs.amazon.outputs.head || needs.google.outputs.head || needs.openai.outputs.head || needs.anthropic.outputs.head || github.sha }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}

  # No model and no bot token. Carries the commits other people pushed onto
  # the bot PR onto the vendors' commits (carry.sh), checked in the sandbox.
  carry:
    needs: [plan, anthropic, openai, google, amazon, meta, mistral]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.carry != '[]' && needs.plan.outputs.stop != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.carry.outputs.base }}
      tip: ${{ steps.carry.outputs.tip }}
      carried: ${{ steps.carry.outputs.carried }}
      refused: ${{ steps.carry.outputs.refused }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true
        with:
          pattern: reconcile-bundle-*
          path: ${{ runner.temp }}/bundles
      # The last vendor commit, as combine.sh takes it, else the run's own.
      - name: Check out the vendors' commits
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ needs.plan.outputs.run }}
        run: |
          tip="$(jq -r --argjson run "$RUN" '. as $needs | [$run[] | $needs[.].outputs // {} | select(.head != "" and .changed == "true") | .head] | last // empty' <<<"$NEEDS")"
          tip="${tip:-$GITHUB_SHA}"
          .github/reconcile-models/checkout-base.sh "$tip" "$RUNNER_TEMP/bundles/reconcile-bundle-$tip/reconcile.bundle"
      - name: Install the sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Carry the other commits (no model)
        id: carry
        env:
          GH_TOKEN: ${{ github.token }}
          CARRY: ${{ needs.plan.outputs.carry }}
        run: |
          # Everything that needs the network happens before carry.sh's sandbox.
          task install:go
          export PATH="$(dirname "$(ls -d "$PWD"/.build/go*/bin/go | tail -1)"):$PATH"
          GOTOOLCHAIN=local go mod download
          GOTOOLCHAIN=local go build -o "$RUNNER_TEMP/catalog-replay" ./cmd/catalog-replay
          bot_id="$(gh api users/vbotbuildovich --jq .id)"
          export GIT_COMMITTER_NAME=vbotbuildovich GIT_COMMITTER_EMAIL="${bot_id}+vbotbuildovich@users.noreply.github.com"
          mapfile -t commits < <(jq -r '.[]' <<<"$CARRY")
          # The catalogue before and after people's commits, for the probe job.
          mkdir -p "$RUNNER_TEMP/carry"
          cp catalog/snapshot.json "$RUNNER_TEMP/carry/base-snapshot.json"
          GOTOOLCHAIN=local .github/reconcile-models/carry.sh "$RUNNER_TEMP/catalog-replay" "${commits[@]}"
          cp catalog/snapshot.json "$RUNNER_TEMP/carry/snapshot.json"
          git bundle create "$RUNNER_TEMP/reconcile.bundle" HEAD "^${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: reconcile-bundle-${{ steps.carry.outputs.tip }}
          path: ${{ runner.temp }}/reconcile.bundle
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: reconcile-carry
          path: ${{ runner.temp }}/carry/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # No model. Calls each offering the PR's commits add or change once on
  # its host, with a tiny request, for the PR body's "Live checks": the only
  # job with provider keys, so it runs the run's own code and reads the
  # vendors' and the carry job's folders only as data. A call that fails
  # never stops the PR.
  probe:
    needs: [plan, anthropic, openai, google, amazon, meta, mistral, carry]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.stop != 'true' && contains(toJSON(needs.*.outputs.changed), 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the Bedrock CI role, for the Bedrock calls
    steps:
      # Every later step reaches only these hosts: the providers' APIs (and
      # AWS's token service), then installs (GitHub, Go and its modules).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.openai.com:443
            generativelanguage.googleapis.com:443
            sts.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.eu-central-1.amazonaws.com:443
            bedrock-runtime.eu-central-1.amazonaws.com:443
            bedrock.ap-southeast-2.amazonaws.com:443
            bedrock-runtime.ap-southeast-2.amazonaws.com:443
            bedrock.ap-northeast-1.amazonaws.com:443
            bedrock-runtime.ap-northeast-1.amazonaws.com:443
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            *.githubapp.com:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Check the egress block
        run: .github/reconcile-models/check-egress.sh
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true
        with:
          pattern: reconcile-pr-*
          path: ${{ runner.temp }}/legs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: needs.carry.outputs.tip != ''
        with:
          name: reconcile-carry
          path: ${{ runner.temp }}/carry
      - name: Build catalog-probe
        run: |
          task install:go
          export PATH="$(dirname "$(ls -d "$PWD"/.build/go*/bin/go | tail -1)"):$PATH"
          GOTOOLCHAIN=local go build -o "$RUNNER_TEMP/catalog-probe" ./cmd/catalog-probe
      # The keyed tests' role (terraform/ai-sdk-ci), which may only call
      # Bedrock. When it can't be assumed, the Bedrock rows say so and the
      # other hosts are still called.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::502376765358:role/ai-sdk-go-ci-bedrock
          aws-region: us-east-1
      # The folder of each vendor whose change was checked and committed, as
      # the carry job picks the vendors' commits, then the carry job's, whose
      # catalogue is the PR's when it carried people's commits.
      - name: Call each new or changed offering (no model)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ needs.plan.outputs.run }}
          CARRY_TIP: ${{ needs.carry.outputs.tip }}
        run: |
          dirs=()
          for vendor in $(jq -r --argjson run "$RUN" '. as $needs | $run[] | select(($needs[.].outputs.head // "") != "" and $needs[.].outputs.changed == "true")' <<<"$NEEDS"); do
            dirs+=("$RUNNER_TEMP/legs/reconcile-pr-$vendor")
          done
          if [[ -n "$CARRY_TIP" ]]; then dirs+=("$RUNNER_TEMP/carry"); fi
          "$RUNNER_TEMP/catalog-probe" -out out/probe "${dirs[@]}"
          cat out/probe/probes.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: reconcile-probe
          path: out/probe/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The only job with the bot token. It puts the vendors' commits together
  # into one PR and pushes once, at the end; it runs nothing from the patches.
  pr:
    needs: [plan, anthropic, openai, google, amazon, meta, mistral, carry, probe]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write # only used outside dry runs, to read the bot token
    env:
      BASE: ${{ github.ref_name }}
      H0: ${{ needs.plan.outputs.h0 }}
      PR: ${{ needs.plan.outputs.pr }}
      # "Update branch" merges the plan left out of the rebuild.
      DROPPED: ${{ needs.plan.outputs.dropped }}
      # A commit on the PR that can't be carried stops the push, whether the
      # plan found it before any agent ran or the carry job after.
      STOP: ${{ needs.plan.outputs.stop == 'true' || needs.carry.outputs.refused != '' }}
      REASON: ${{ needs.plan.outputs.reason || needs.carry.outputs.refused }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      # A vendor that failed early has no folder and a vendor that changed
      # nothing has no bundle; combine.sh fails on anything it needs and lacks.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: env.STOP != 'true'
        continue-on-error: true
        with:
          pattern: reconcile-pr-*
          path: ${{ runner.temp }}/legs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: env.STOP != 'true'
        continue-on-error: true
        with:
          pattern: reconcile-bundle-*
          path: ${{ runner.temp }}/bundles
      # Only this attempt's probe job's block: a re-run could find an
      # earlier attempt's.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: env.STOP != 'true' && needs.probe.result == 'success'
        continue-on-error: true
        with:
          name: reconcile-probe
          path: ${{ runner.temp }}/probe
      - name: Put the vendors' parts together (no model)
        id: combine
        if: env.STOP != 'true'
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ needs.plan.outputs.run }}
          PENDING: ${{ needs.plan.outputs.pending }}
          CARRY: ${{ needs.plan.outputs.carry }}
          CARRY_TIP: ${{ needs.carry.outputs.tip }}
          CARRIED: ${{ needs.carry.outputs.carried }}
          CARRY_BASE: ${{ needs.carry.outputs.base }}
          # The probe job's block; the body says so when it's missing.
          LIVE_CHECKS: ${{ runner.temp }}/probe/probes.md
        run: |
          task install:go
          export PATH="$(dirname "$(ls -d "$PWD"/.build/go*/bin/go | tail -1)"):$PATH"
          GOTOOLCHAIN=local go build -o "$RUNNER_TEMP/catalog-report" ./cmd/catalog-report
          .github/reconcile-models/combine.sh "$RUNNER_TEMP/catalog-report" "$RUNNER_TEMP/legs" "$RUNNER_TEMP/bundles" out
      # A person's recent, non-draft PR on a models.go this patch changes doesn't
      # stop the bot: the PR body names it, so the reviewer can merge theirs
      # first, and the next run leaves out what it already contains. Drafts and
      # PRs older than 7 days aren't named, or long-lived PRs would always be.
      - name: Name recent PRs that touch the same models.go
        if: steps.combine.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touched="$(grep -E '^providers/[a-z0-9]+/models\.go$' out/files.txt | tr '\n' ' ' || true)"
          others="$(TOUCHED="$touched" gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName,files,isDraft,createdAt \
            --jq '[.[] | select(.headRefName != env.BRANCH) | select(.isDraft | not)
              | select((.createdAt | fromdateiso8601) > (now - 7 * 86400))
              | select(any(.files[].path; . as $f | any(env.TOUCHED | split(" ")[]; . == $f)))
              | .number] | map(tostring) | join(",")')"
          if [[ -n "$others" ]]; then
            echo "Recent open PRs touch ${touched}: $others"
            note="> **Open PRs touch the same files:** $(sed -E 's/[0-9]+/#&/g; s/,/, /g' <<<"$others"). If they overlap, merge theirs first: the next run leaves out what they already contain."
            { head -n 2 out/body.md; echo "$note"; echo; tail -n +3 out/body.md; } >out/body.next && mv out/body.next out/body.md
          fi
      - name: Job summary
        if: always()
        run: if [[ -f out/body.md ]]; then cat out/body.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: reconcile-pr
          path: |
            out/body.md
            out/snapshot.diff
          retention-days: 7
          overwrite: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        if: env.DRY_RUN == 'false' && (steps.combine.outputs.changed == 'true' || env.STOP == 'true')
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88  # v3.0.2
        if: env.DRY_RUN == 'false' && (steps.combine.outputs.changed == 'true' || env.STOP == 'true')
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      # Keep anyone else's commit on the bot PR that the run can't carry: say
      # the run didn't update the PR instead of pushing over it. One note per
      # PR, updated each run.
      - name: Leave a note instead of pushing over someone's commit
        if: env.DRY_RUN == 'false' && env.STOP == 'true'
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "This run didn't update the PR, because ${REASON}. Merge or close this PR, or remove that commit if it was pushed after the bot's last update, to let the next run update it. [The run](${run_url}) has the details."
          echo "::notice::Left #${PR} unchanged, because ${REASON}."
      # What a later run replays from; saved first, so every push has one.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: env.DRY_RUN == 'false' && steps.combine.outputs.changed == 'true'
        with:
          name: reconcile-record
          path: out/record.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Push the vendors' commits and open or update the draft PR
        if: env.DRY_RUN == 'false' && steps.combine.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
          TIP: ${{ steps.combine.outputs.tip }}
        run: |
          git switch -C "$BRANCH"  # combine.sh checked out the tip
          # The push below changes the code in every PR from this repo whose head
          # is $BRANCH, so stop if anyone but the bot has one open.
          others="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and .author.login != "vbotbuildovich") | "#\(.number)"] | join(", ")')"
          if [[ -n "$others" ]]; then
            echo "::error::Open PRs from ${BRANCH} by someone other than vbotbuildovich: ${others}. The push would put new agent code in them; close them or open them from another branch, then re-run."
            exit 1
          fi
          same_as_pr() {
            local pr_commits
            pr_commits="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits?per_page=100" --jq '[.[].sha]')"
            git fetch -q --no-tags --depth="$(( $(jq length <<<"$pr_commits") + 1 ))" origin "$H0"
            # The merges the plan left out aren't the PR's changes.
            pr_commits="$(jq -c --argjson dropped "$DROPPED" '. - $dropped' <<<"$pr_commits")"
            .github/reconcile-models/same-patches.sh "$pr_commits" "$(git rev-list --reverse "${GITHUB_SHA}..HEAD" | jq -R . | jq -sc .)"
          }
          # The plan's PR is from before this run; a re-run of this job after its
          # first attempt opened the PR finds it here, and edits it.
          PR="${PR:-$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author,isCrossRepository \
            --jq '[.[] | select(.author.login == "vbotbuildovich" and (.isCrossRepository | not))][0].number // empty')}"
          push=true
          if [[ -n "$PR" ]]; then
            read -r state head draft <<<"$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,isDraft --jq '"\(.state) \(.headRefOid) \(.isDraft)"')"
            if [[ "$state" != "OPEN" ]]; then
              echo "::notice::#${PR} was closed during the run, so this run leaves it closed."
              exit 0
            fi
            if [[ "$head" == "$TIP" ]]; then
              push=false  # a re-run of this job after its push: only the body is left to do
            elif [[ "$head" != "$H0" ]]; then
              echo "::error::Someone pushed to #${PR} during the run (${head}); the next run sees it."
              exit 1
            elif same_as_pr; then
              # Pushing the same changes again would dismiss approvals for nothing.
              push=false
              echo "::notice::This run's commits make the same changes as #${PR}'s, so it updates only the body."
            elif [[ "$draft" == "false" ]]; then
              # A PR a person marked ready goes back to draft before the push, so
              # new agent code runs only test.yaml's no-secrets job until reviewed again.
              gh pr ready "$PR" --repo "$GITHUB_REPOSITORY" --undo
            fi
          fi
          # Leased to the head the plan job read before any agent started; an
          # empty head means the branch must not exist yet.
          if [[ "$push" == "true" ]]; then
            git push --force-with-lease="refs/heads/${BRANCH}:${H0}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          fi
          if [[ -n "$PR" ]]; then
            # The label again on every update: a person may have removed it.
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --base "$BASE" --body-file out/body.md --add-label ai-merge-skip
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$BASE" --head "$BRANCH" \
              --title "chore(catalog): reconcile models" --body-file out/body.md \
              --label ai-merge-skip --reviewer adamwownysz-redpanda
          fi
