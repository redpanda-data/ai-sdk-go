name: "Examples"

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'Taskfile.yaml'
      - '.golangci.examples.yaml'
      - '.github/workflows/examples.yaml'
  pull_request:
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'Taskfile.yaml'
      - '.golangci.examples.yaml'
      - '.github/workflows/examples.yaml'

permissions:
  contents: read

jobs:
  examples:
    name: Build Examples
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            .build
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum', 'Taskfile.yaml', 'taskfiles/install.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2

      # Examples are documentation — a broken example is broken docs. They sit
      # outside the root module (`ignore ./examples`), so nothing else in CI
      # compiles them.
      - name: Build example modules
        run: task examples:build

      # Users copy the examples, so one that calls a deprecated model fails
      # here rather than breaking for them after the model shuts down.
      - name: Lint example modules for deprecated identifiers
        run: task examples:lint
