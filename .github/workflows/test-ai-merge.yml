---
name: test-ai-merge
on:
  push:
    branches: [main]
    paths: ['.github/actions/ai-merge/**', '.github/ai-merge.yml', '.github/workflows/test-ai-merge.yml']
  pull_request:
    paths: ['.github/actions/ai-merge/**', '.github/ai-merge.yml', '.github/workflows/test-ai-merge.yml']
jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/actions/ai-merge/scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
