---
name: test-ai-merge
on:
  push:
    branches: [main]
    paths: ['.github/actions/ai-merge/**', '.github/workflows/test-ai-merge.yml']
  pull_request:
    paths: ['.github/actions/ai-merge/**', '.github/workflows/test-ai-merge.yml']
jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/actions/ai-merge/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
