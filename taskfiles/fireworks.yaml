version: '3'

tasks:
  replay:
    desc: Replay recorded Fireworks regression fixtures without credentials
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - task: run
        vars:
          CONTRACT_MODE: replay

  record:
    desc: Capture live Fireworks cases for review (billable; output path and spend limit required)
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - task: run
        vars:
          CONTRACT_MODE: record
      - task: replay

  accept:
    desc: Run offline replay and opt-in live Fireworks checks
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - task: replay
      - task: run
        vars:
          CONTRACT_MODE: accept

  run:
    internal: true
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        go test -c -o "$tmp/contracts" ./providers/fireworks
        listed=$("$tmp/contracts" -test.list '^TestFireworksContract(Live|Replay|Fixtures)$')
        for name in TestFireworksContractLive TestFireworksContractReplay TestFireworksContractFixtures; do
          printf '%s\n' "$listed" | grep -Fxq "$name" || { echo "missing required test: $name" >&2; exit 1; }
        done
        cd providers/fireworks
        case '{{.CONTRACT_MODE}}' in
          replay) "$tmp/contracts" -test.run '^TestFireworksContract(Replay|Fixtures|NativeReplay|OriginalCharacterization|Synthetic.*)$' -test.short -test.timeout=10m {{.CLI_ARGS}} ;;
          record) "$tmp/contracts" -test.run '^TestFireworksContractLive$' -test.v -test.timeout=30m -fireworks-live -fireworks-record {{.CLI_ARGS}} ;;
          accept) "$tmp/contracts" -test.run '^TestFireworksContractLive$' -test.v -test.timeout=30m -fireworks-live {{.CLI_ARGS}} ;;
          *) echo 'invalid contract mode' >&2; exit 1 ;;
        esac
